<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Notch</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }

    /* striscia nera attaccata al notch vero */
    #notch {
      height: 100%;
      background-color: #000;
      border-radius: 0 0 16px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      cursor: pointer;
    }

    /* faccina che dorme (a sinistra, il notch vero sta in mezzo) */
    .faccina {
      position: relative;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #fff;
    }

    .faccina::before,
    .faccina::after {
      content: "";
      position: absolute;
      top: 8px;
      width: 4px;
      height: 2px;
      background-color: #000;
    }

    .faccina::before { left: 4px; }
    .faccina::after  { right: 4px; }

    #testo {
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      min-width: 30px;
      text-align: right;
    }

    /* le z che salgono */
    #testo span {
      display: inline-block;
      animation: zeta 1.8s infinite;
    }
    #testo span:nth-child(2) { animation-delay: 0.3s; }
    #testo span:nth-child(3) { animation-delay: 0.6s; }

    @keyframes zeta {
      0%   { transform: translateY(3px); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: translateY(-5px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="notch">
    <div class="faccina"></div>
    <div id="testo"><span>z</span><span>z</span><span>z</span></div>
  </div>

  <script>
    // clic sul notch: Franco si sveglia
    document.getElementById("notch").addEventListener("click", function () {
      window.mac.notchCliccato();
    });

    // il testo a destra lo decide la finestra di Franco
    window.mac.quandoTestoNotch(function (testo) {
      document.getElementById("testo").innerHTML = testo;
    });
  </script>
</body>
</html>
